apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: drycc-resources
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gateway.name }}
    namespace: {{ .Values.gateway.namespace }}
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    hostname: {{ printf "drycc-resources.%s" .Values.global.platformDomain | lower }}
    name: http-80-resources
    port: 80
    protocol: HTTP
  {{- if .Values.global.certManagerEnabled }}
  - name: https-443-resources
    port: 443
    protocol: HTTPS
    hostname: {{ printf "drycc-resources.%s" .Values.global.platformDomain | lower }}
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: drycc-auto-tls
  {{- end }}
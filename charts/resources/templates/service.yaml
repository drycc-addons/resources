apiVersion: v1
kind: Service
metadata:
  name: drycc-resources
  labels:
    app: drycc-resources
    heritage: drycc
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: drycc-resources

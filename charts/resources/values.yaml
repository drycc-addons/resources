# Default values for resources.
replicaCount: 1

image:
  repository: registry.drycc.cc/drycc-addons/resources
  pullPolicy: IfNotPresent
  tag: "canary"

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
# Secret key for Django
secretKey: ""

# Ingress configuration
gateway:
  name: drycc-gateway
  namespace: drycc

# Controller configuration
controller:
  url: http://drycc-controller-api.drycc
  namespace: drycc
  verifyTLS: true
  authCacheTTL: 30

# Kubernetes configuration
kubernetes:
  apiVerifyTLS: true

# Workflow manager configuration (optional)
workflowManager:
  url: ""
  accessKey: ""

# Quickwit logging configuration (optional)
quickwit:
  indexerUrl: ""
  logIndexPrefix: ""

# Valkey configuration
valkey:
  replicas: 3
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""

# Database configuration
database:
  superuser: "postgres"
  superuserPassword: ""
  replicator: "standby"
  replicatorPassword: ""
  user: ""
  password: ""
  initDatabases: "resources"
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""

global:
  # The public resolvable hostname to build your cluster with.
  #
  # This will be the hostname that is used to build endpoints such as "drycc.$HOSTNAME"
  platformDomain: ""
  # Whether cert_manager is enabled to automatically generate controller certificates
  certManagerEnabled: true

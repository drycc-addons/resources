# Default values for resources.
replicaCount: 1

image:
  repository: registry.drycc.cc/drycc-addons/resources
  pullPolicy: IfNotPresent
  tag: "canary"

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Controller configuration
controller:
  url: http://drycc-controller.drycc
  verifyTLS: true
  authCacheTTL: 30

# Valkey configuration (optional; leave url empty to disable cache)
# recommended: redis://:password@drycc-valkey:16379/9
valkey:
  url: ""

# Database configuration
database:
  url: postgres://postgres:@drycc-database:5432/drycc_resources

# Kubernetes configuration
kubernetes:
  apiVerifyTLS: true
  # namespace defaults to .Release.Namespace when empty
  namespace: ""

# Workflow manager configuration (optional)
workflowManager:
  url: ""
  accessKey: ""

# Quickwit logging configuration (optional)
quickwit:
  indexerUrl: ""
  logIndexPrefix: ""

# Secret key for Django
secretKey: ""
